<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Layout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="layout">
        <header class="header">
            <h1>Header</h1>
        </header>

        <div class="middle">

            <aside class="left">
                <h2>Left</h2>
                <p>Life side bhi kuchh likh denge</p>
            </aside>
            <main class="main">
                <h2>Main</h2>
                <p>Hii ,this is main section</p>
            </main>

            <aside class="right">
                <h2>Right</h2>
                <p>Right me socha nhi hai kuchh</p>
            </aside>

        </div>
        <footer class="footer">
            <h2>Footer</h2>
        </footer>

    </div>
</body>
</html>
