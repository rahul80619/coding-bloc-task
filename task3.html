<!DOCTYPE html>
<html>
<head>
    <title>Tisra task</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .p2{
            color: blue;
            border: 1px solid black;
            padding: 5px;
        }
    </style>
</head>
<body>
    <p class="p1">This is paragraph one. (External CSS → Green)</p>
    <p class="p2">This is paragraph two. (Style tag → Blue)</p>
    <p class="p3" style="color: pink; border:1px solid black; padding:5px;">
        This is paragraph three. (Inline CSS → Pink)
    </p>
</body>
</html>
